[project]
name = "aurora-trading-mvp"
version = "0.1.0"
description = "Aurora Trading AI - lean Python MVP: paper trading, hard risk limits, one baseline strategy"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "SQLAlchemy>=2.0",
    "psycopg2-binary>=2.9",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "pandas>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
