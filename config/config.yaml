mode: PAPER  # PAPER -> Alpaca paper endpoint; LIVE -> Alpaca live (manual switch only)

symbols:
  - BTC-USD

timeframe: "5m"

# Matches the Alpaca paper account's balance. Execution, account and
# positions are now Alpaca's real (paper) state via AlpacaBroker - the
# local PaperSimulatorBroker is only used by the backtest engine now.
starting_equity: 100000

execution:
  # Spot crypto can't be shorted on Alpaca. With allow_short false, a SHORT
  # signal can only reduce an existing long (a SELL clamped to the held
  # quantity); a SHORT with nothing to reduce is a no-op. The backtest
  # engines honor the same flag so their numbers stay comparable to live.
  allow_short: false

strategy:
  # spike_multiplier raised 2.0 -> 3.0 on 2026-08-29 after a live week
  # (2026-08-22 to 08-29) with the old value produced 56 trades and a net
  # -1.17% with no clear direction. Re-backtested on the same 90d BTC-USD/
  # ETH-USD window (v2 risk profile, position size held at 10% - a separate
  # sweep confirmed raising position size to 15%/20% instead makes it worse,
  # not better: BTC flips from +1.25% to -3.48%/-8.57%). At spike_multiplier
  # 3.0, both assets came out ahead of the 2.0 baseline across every window
  # size tested (10/15/20/30/40), in two independent runs taken days apart -
  # a higher bar for what counts as a real volatility spike cuts ~1500
  # trades/90d down to ~450, filtering out noise-sized "spikes" that were
  # mostly just fee-losing coin flips. Still just backtest evidence on one
  # historical window, not a validated edge.
  name: volatility_spike
  window: 20
  spike_multiplier: 3.0
  # Regime filter (roadmap #2, live 2026-09-07). volatility_spike is a
  # momentum strategy; in choppy markets its "spikes" mean-revert and the
  # trades just bleed fees. er_period/er_threshold gate a spike signal on
  # the Kaufman efficiency ratio over the last er_period bars (net move /
  # summed absolute moves; 0 = chop, 1 = clean trend) - a spike only trades
  # when er >= er_threshold. 90d BTC+ETH sweep (allow_short=false, real
  # 0.25% Alpaca fee): all 20 tested combos beat the long-only no-filter
  # baseline on BOTH assets. This combo: BTC +7.2% / ETH +12.7% vs
  # -4.0% / -0.3%, drawdown ~5-8%, trades cut from ~420 to ~150. Still one
  # historical window, not a validated edge (Regla 4).
  er_period: 30
  er_threshold: 0.35

risk:
  # Aggressive profile v2 (2026-08-22d) — strategy itself left untouched
  # (still volatility_spike, window=20, spike_multiplier=2.0), only these
  # risk numbers raised, per explicit user decision to chase ~7%/month with
  # simulated money and accept the possibility of losing all of it.
  # Re-backtested on the full 90d BTC-USD/ETH-USD window *after* fixing the
  # drawdown-deadlock bug (commit f24c524) that had been silently inflating
  # every earlier number in this file's history: at this position size, BTC
  # total return over the full window is -3.06% and ETH is +0.44% - neither
  # asset reliably clears 7%/month, and bigger sizes tested (15-40%) did
  # worse on both, not better, since size just amplifies whichever month you
  # happen to be in. The one honest data point supporting a "7% shot": BTC's
  # best single month at this size hit +18.8% (June), so a good month *can*
  # clear the target - a bad month (July, -24.4% at this size) can erase it
  # just as fast. This is the closest real-data-backed attempt at the user's
  # target, not a validated edge. Rollback: config/config.conservative.yaml
  # + git tag pre-aggressive-baseline-2026-08-22.
  max_daily_loss_pct: 15.0
  max_trade_risk_pct: 0.5
  max_position_pct: 10.0
  max_portfolio_exposure_pct: 50.0
  max_drawdown_pct: 30.0
  max_leverage: 1.0
  max_trades_per_day: 30

loop_interval_seconds: 60
