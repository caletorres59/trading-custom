mode: PAPER  # PAPER -> Alpaca paper endpoint; LIVE -> Alpaca live (manual switch only)

symbols:
  - BTC-USD
  # Added 2026-09-18. The 09-18 check-in found the live account had gone
  # completely quiet for 10 straight days (09-07 to 09-17, zero trades -
  # the regime filter correctly sat out a choppy/declining BTC stretch) and
  # only traded on the 11th day when BTC finally broke out. Adding ETH-USD
  # doesn't fix the filter's selectivity, but it does roughly double the
  # number of chances per day for *some* symbol to qualify. 90d backtest
  # (real 0.25% fee, current strategy/risk params, shared $100k account /
  # 50% exposure cap - i.e. the actual live setup, not two separate
  # accounts): BTC-only +10.45% (maxDD 4.74%, Sharpe 2.53, 124 trades) vs
  # BTC+ETH basket +10.75% (maxDD 6.32%, Sharpe 1.87, 251 trades - roughly
  # 2x the trade frequency). Total return is only modestly better and the
  # risk-adjusted profile (Sharpe, drawdown) is actually a bit worse than
  # BTC alone, since BTC/ETH are highly correlated (little real
  # diversification - same lesson as roadmap idea #1's basket rejection).
  # Shipped anyway for the trade-frequency benefit, which directly answers
  # what the 09-18 check-in flagged as broken; still one 90d window, not a
  # validated edge (Regla 4).
  - ETH-USD

timeframe: "5m"

# Matches the Alpaca paper account's balance. Execution, account and
# positions are now Alpaca's real (paper) state via AlpacaBroker - the
# local PaperSimulatorBroker is only used by the backtest engine now.
starting_equity: 100000

execution:
  # Spot crypto can't be shorted on Alpaca. With allow_short false, a SHORT
  # signal can only reduce an existing long (a SELL clamped to the held
  # quantity); a SHORT with nothing to reduce is a no-op. The backtest
  # engines honor the same flag so their numbers stay comparable to live.
  allow_short: false

strategy:
  # spike_multiplier raised 2.0 -> 3.0 on 2026-08-29 after a live week
  # (2026-08-22 to 08-29) with the old value produced 56 trades and a net
  # -1.17% with no clear direction. Re-backtested on the same 90d BTC-USD/
  # ETH-USD window (v2 risk profile, position size held at 10% - a separate
  # sweep confirmed raising position size to 15%/20% instead makes it worse,
  # not better: BTC flips from +1.25% to -3.48%/-8.57%). At spike_multiplier
  # 3.0, both assets came out ahead of the 2.0 baseline across every window
  # size tested (10/15/20/30/40), in two independent runs taken days apart -
  # a higher bar for what counts as a real volatility spike cuts ~1500
  # trades/90d down to ~450, filtering out noise-sized "spikes" that were
  # mostly just fee-losing coin flips. Still just backtest evidence on one
  # historical window, not a validated edge.
  name: volatility_spike
  window: 20
  spike_multiplier: 3.0
  # Regime filter (roadmap #2, live 2026-09-07). volatility_spike is a
  # momentum strategy; in choppy markets its "spikes" mean-revert and the
  # trades just bleed fees. er_period/er_threshold gate a spike signal on
  # the Kaufman efficiency ratio over the last er_period bars (net move /
  # summed absolute moves; 0 = chop, 1 = clean trend) - a spike only trades
  # when er >= er_threshold. 90d BTC+ETH sweep (allow_short=false, real
  # 0.25% Alpaca fee): all 20 tested combos beat the long-only no-filter
  # baseline on BOTH assets. This combo: BTC +7.2% / ETH +12.7% vs
  # -4.0% / -0.3%, drawdown ~5-8%, trades cut from ~420 to ~150. Still one
  # historical window, not a validated edge (Regla 4).
  er_period: 30
  er_threshold: 0.35

risk:
  # max_position_pct lowered 10% -> 2% on 2026-09-18, in direct response to
  # the user asking "should we raise risk to reach 7%/month" after the
  # ETH-USD addition. Tested that exact question first (2%/5%/10%/15%/20%/
  # 30%/40%, 90d BTC+ETH basket, real 0.25% fee, current strategy): result
  # was the OPPOSITE of the premise - raising size made every metric worse,
  # smoothly and monotonically (total return +18.57%@2% -> +10.86%@10% ->
  # +3.48%@30%; Sharpe 2.89 -> 1.87 -> 0.68; maxDD 4.39% -> 6.32% -> 8.88%).
  # Root cause: bigger per-trade size hits max_portfolio_exposure_pct (50%)
  # sooner, so good signals start getting REJECTed instead of filled (13
  # rejects@2% -> 62@30-40%) - fewer of the strategy's good trades actually
  # land, and the ones that do concentrate risk into fewer, more correlated
  # bets (ETH's contribution flipped from +$15,973@2% to -$1,037@30%). Same
  # "size doesn't create edge" lesson as every prior sweep in this project,
  # just showing up in the other direction this time. Shipped without a
  # second robustness check (unlike prior strategy changes) at the user's
  # explicit request, to be monitored daily instead - this is also a risk
  # DECREASE, not an increase, so the downside of being wrong is smaller
  # than usual. Rollback: git tag pre-2pct-position-2026-09-18.
  max_daily_loss_pct: 15.0
  max_trade_risk_pct: 0.5
  max_position_pct: 2.0
  max_portfolio_exposure_pct: 50.0
  max_drawdown_pct: 30.0
  max_leverage: 1.0
  max_trades_per_day: 30


# Roadmap #3 (asymmetric exits / "let winners run") - built 2026-09-18
# (src/aurora/risk/trailing_stop.py, tested end-to-end in both backtest
# engines and the live loop) but NOT enabled. 90d BTC+ETH sweep (real
# 0.25% fee, current strategy/risk params) tested a stop_loss_pct 2-12% x
# trail_activation_pct 2-20% x trail_pct 1-10% grid: every combination
# either did nothing (loose thresholds never fired - identical to the
# no-exit baseline) or made both assets worse (tighter thresholds), never
# better, at any point in the grid. Isolating the two pieces confirmed
# why: the hard stop_loss essentially never fires at this position size
# (a small max_position_pct means no single trade is ever down enough to
# trip a realistic stop before the strategy's own logic or the kill switch
# would have acted anyway - even more true now that max_position_pct is
# 2% instead of the 10% this was tested against), and the trailing exit
# just interrupts this
# strategy's actual way of capturing a trend - repeated staggered re-entries
# on successive spikes, not one long static hold - so an early trailing
# exit forces an unnecessary sell-then-rebuy (extra fees) without
# capturing any extra upside. Rejected per the same "backtest first, ship
# only if it helps" standard as roadmap idea #1 (multi-symbol basket).
# Kept in the codebase, off by default, in case a future strategy change
# (one that holds fewer, larger positions) makes it worth revisiting.
exits:
  enabled: false
  stop_loss_pct: 0
  trail_activation_pct: 0
  trail_pct: 0

loop_interval_seconds: 60
