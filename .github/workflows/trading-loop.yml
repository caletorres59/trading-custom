name: Aurora Trading Loop

# GitHub's native `schedule` trigger proved unreliable for this repo (never
# fired on its own after 1h15m+ despite correct config) - Supabase pg_cron
# now drives this via workflow_dispatch every 5 minutes instead. Keeping
# only workflow_dispatch avoids double-firing if GitHub's scheduler ever
# does wake up on its own.
on:
  workflow_dispatch: {}

jobs:
  run-once:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e .

      - name: Run one trading loop iteration
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m aurora.main --once
